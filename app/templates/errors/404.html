{% extends "base.html" %}

{% block title %}Page Not Found — SSVS{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card card-glass p-5 shadow-sm">
        <div class="display-1 fw-extrabold text-primary mb-2">404</div>
        <h3 class="fw-bold mb-3">Resource or Assessment Not Found</h3>
        <p class="text-secondary mb-4">The page or assessment URL you are looking for does not exist or has been relocated.</p>
        <div class="d-flex justify-content-center gap-2">
          <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-gradient px-4">
            Return to Homepage
          </a>
          <a href="{{ url_for('student.public_leaderboard_search') }}" class="btn btn-outline-secondary px-4">
            Browse Leaderboards
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
