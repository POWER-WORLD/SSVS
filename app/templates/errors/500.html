{% extends "base.html" %}

{% block title %}Server Error — SSVS{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card card-glass p-5 shadow-sm">
        <div class="display-1 fw-extrabold text-danger mb-2">500</div>
        <h3 class="fw-bold mb-3">Internal Server Error</h3>
        <p class="text-secondary mb-4">An unexpected error occurred while processing this request. Our technical team has been notified.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-gradient px-4">
          Return to Safety
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
